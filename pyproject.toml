[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling>=1.10",
]

[project]
name = "papis-abbrev"
version = "0.2.0"
description = "Papis plugin that abbreviates journals according to LWTA"
readme = "README.rst"
keywords = [
    "bibliography",
]
license = "MIT"
maintainers = [
    { name = "Alexandru Fikl", email = "alexfikl@gmail.com" },
]
authors = [
    { name = "Alexandru Fikl", email = "alexfikl@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "papis>=0.14",
    "pyiso4>=0.1.6",
]
# NOTE: this is only here for readthedocs (keep in sync with the dependency group)
optional-dependencies.docs = [ "sphinx>=6", "sphinx-autoapi", "sphinx-book-theme" ]
urls.Repository = "https://github.com/alexfikl/papis-abbrev"
entry-points."papis.command".abbrev = "papis_abbrev.command:cli"

[dependency-groups]
dev = [ "pyproject-fmt", "reuse", "typos", "uv" ]
test = [ "pytest", "ruff", "ty" ]

[tool.hatch]
build.targets.wheel.packages = [
    "src/papis_abbrev",
]
build.targets.sdist.exclude = [
    ".ci",
    ".github",
    "docs/_build",
]

[tool.ruff]
target-version = "py39"
line-length = 88
preview = true
lint.select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # flake8
    "F",   # flake8
    "FBT", # flake8-boolean-trap
    "G",   # flake8-logging-format
    "I",   # flake8-isort
    "ISC", # flake8-implicit-str-concat
    "N",   # pep8-naming
    "PL",  # pylint
    "Q",   # flake8-quotes
    "RUF", # ruff
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "UP",  # pyupgrade
    "W",   # flake8
]
lint.ignore = [
    "assert",
    "boolean-type-hint-positional-argument",
    "exec-builtin",
    "import-outside-top-level",
    "magic-value-comparison",
    "module-import-not-at-top-of-file",
    "quoted-annotation",
    "single-line-implicit-string-concatenation",
    "suspicious-non-cryptographic-random-usage",
    "too-many-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-statements",
]
lint.flake8-quotes.docstring-quotes = "double"
lint.flake8-quotes.inline-quotes = "double"
lint.flake8-quotes.multiline-quotes = "double"
lint.isort.known-first-party = [
    "papis",
    "papis_abbrev",
]

[tool.typos]
default.extend-ignore-re = [
    "(?Rm)^.*#\\s*spell:\\s*disable$",
]

[tool.pytest]
ini_options.testpaths = "test"
ini_options.addopts = [
    "-rswx",
    "--durations=25",
    "--capture=no",
    "--verbose",
]
